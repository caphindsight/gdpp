  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">greet</tspan><tspan fill="#e6edf3">(name: </tspan><tspan fill="#7ee787">String</tspan><tspan fill="#e6edf3">, times: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">for</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> i = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">; i &lt; times; i++) {</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Hello, "</tspan><tspan fill="#e6edf3">, name, </tspan><tspan fill="#d2a8ff">"!"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#79c0ff">@override</tspan></text>
  <text x="16" y="170"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_ready</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">greet</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"world"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">}</tspan></text>
