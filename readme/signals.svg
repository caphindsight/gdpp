<svg xmlns="http://www.w3.org/2000/svg" width="612" height="269" viewBox="0 0 612 269">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">signal</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">health_changed</tspan><tspan fill="#e6edf3">(health: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="50"></text>
  <text x="16" y="70"><tspan fill="#e3b341">enum</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Suit</tspan><tspan fill="#e6edf3"> { DIAMONDS CLUBS SPADES HEARTS }</tspan></text>
  <text x="16" y="90"><tspan fill="#e3b341">enum</tspan><tspan fill="#e6edf3"> MAX_PLAYERS = </tspan><tspan fill="#d2a8ff">4</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_on_body_entered</tspan><tspan fill="#e6edf3">(body: </tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Player</tspan><tspan fill="#e6edf3"> *player = body </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Player</tspan><tspan fill="#e6edf3"> *;   </tspan><tspan fill="#8b949e">// null if body isn't a Player</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (player) {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">    player-&gt;</tspan><tspan fill="#56d4dd">hurt</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">10</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">emit</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">health_changed</tspan><tspan fill="#e6edf3">(player-&gt;health);</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
