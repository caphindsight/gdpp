<svg xmlns="http://www.w3.org/2000/svg" width="839" height="529" viewBox="0 0 839 529">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
  <text y="30"><tspan x="16.0" textLength="226.8" fill="#8b949e">/// The player's character.</tspan></text>
  <text y="50"><tspan x="16.0" textLength="84.0" fill="#e3b341">class_name</tspan><tspan x="108.4" textLength="50.4" fill="#7ee787">Player</tspan></text>
  <text y="70"><tspan x="16.0" textLength="58.8" fill="#e3b341">extends</tspan><tspan x="83.2" textLength="126.0" fill="#7ee787">CharacterBody3D</tspan></text>
  <text y="90"></text>
  <text y="110"><tspan x="16.0" textLength="50.4" fill="#e3b341">signal</tspan><tspan x="74.8" textLength="33.6" fill="#e6edf3">died</tspan></text>
  <text y="130"></text>
  <text y="150"><tspan x="16.0" textLength="109.2" fill="#79c0ff">@export_range</tspan><tspan x="125.2" textLength="8.4" fill="#e6edf3">(</tspan><tspan x="133.6" textLength="8.4" fill="#d2a8ff">0</tspan><tspan x="142.0" textLength="16.8" fill="#e6edf3">, </tspan><tspan x="158.8" textLength="25.2" fill="#d2a8ff">100</tspan><tspan x="184.0" textLength="16.8" fill="#e6edf3">, </tspan><tspan x="200.8" textLength="8.4" fill="#d2a8ff">1</tspan><tspan x="209.2" textLength="8.4" fill="#e6edf3">)</tspan></text>
  <text y="170"><tspan x="16.0" textLength="25.2" fill="#e3b341">var</tspan><tspan x="49.6" textLength="67.2" fill="#e6edf3">health: </tspan><tspan x="116.8" textLength="25.2" fill="#7ee787">int</tspan><tspan x="150.4" textLength="16.8" fill="#e6edf3">= </tspan><tspan x="167.2" textLength="25.2" fill="#d2a8ff">100</tspan></text>
  <text y="190"></text>
  <text y="210"><tspan x="16.0" textLength="58.8" fill="#79c0ff">@export</tspan></text>
  <text y="230"><tspan x="16.0" textLength="25.2" fill="#e3b341">var</tspan><tspan x="49.6" textLength="58.8" fill="#e6edf3">speed: </tspan><tspan x="108.4" textLength="42.0" fill="#7ee787">float</tspan><tspan x="158.8" textLength="16.8" fill="#e6edf3">= </tspan><tspan x="175.6" textLength="25.2" fill="#d2a8ff">5.0</tspan></text>
  <text y="250"></text>
  <text y="270"><tspan x="16.0" textLength="33.6" fill="#e3b341">func</tspan><tspan x="58.0" textLength="33.6" fill="#56d4dd">hurt</tspan><tspan x="91.6" textLength="75.6" fill="#e6edf3">(amount: </tspan><tspan x="167.2" textLength="25.2" fill="#7ee787">int</tspan><tspan x="192.4" textLength="42.0" fill="#e6edf3">) -&gt; </tspan><tspan x="234.4" textLength="33.6" fill="#7ee787">void</tspan><tspan x="276.4" textLength="8.4" fill="#e6edf3">{</tspan></text>
  <text y="290"><tspan x="32.8" textLength="142.8" fill="#e6edf3">health -= amount;</tspan></text>
  <text y="310"><tspan x="32.8" textLength="16.8" fill="#e3b341">if</tspan><tspan x="58.0" textLength="92.4" fill="#e6edf3">(health &lt;= </tspan><tspan x="150.4" textLength="8.4" fill="#d2a8ff">0</tspan><tspan x="158.8" textLength="25.2" fill="#e6edf3">) {</tspan></text>
  <text y="330"><tspan x="49.6" textLength="33.6" fill="#e3b341">emit</tspan><tspan x="91.6" textLength="33.6" fill="#56d4dd">died</tspan><tspan x="125.2" textLength="25.2" fill="#e6edf3">();</tspan></text>
  <text y="350"><tspan x="32.8" textLength="8.4" fill="#e6edf3">}</tspan></text>
  <text y="370"><tspan x="16.0" textLength="8.4" fill="#e6edf3">}</tspan></text>
  <text y="390"></text>
  <text y="410"><tspan x="16.0" textLength="75.6" fill="#79c0ff">@override</tspan></text>
  <text y="430"><tspan x="16.0" textLength="33.6" fill="#e3b341">func</tspan><tspan x="58.0" textLength="134.4" fill="#56d4dd">_physics_process</tspan><tspan x="192.4" textLength="67.2" fill="#e6edf3">(delta: </tspan><tspan x="259.6" textLength="42.0" fill="#7ee787">float</tspan><tspan x="301.6" textLength="42.0" fill="#e6edf3">) -&gt; </tspan><tspan x="343.6" textLength="33.6" fill="#7ee787">void</tspan><tspan x="385.6" textLength="8.4" fill="#e6edf3">{</tspan></text>
  <text y="450"><tspan x="32.8" textLength="58.8" fill="#7ee787">Vector2</tspan><tspan x="100.0" textLength="67.2" fill="#e6edf3">input = </tspan><tspan x="167.2" textLength="42.0" fill="#7ee787">Input</tspan><tspan x="209.2" textLength="16.8" fill="#e6edf3">::</tspan><tspan x="226.0" textLength="109.2" fill="#56d4dd">get_singleton</tspan><tspan x="335.2" textLength="33.6" fill="#e6edf3">()-&gt;</tspan><tspan x="368.8" textLength="84.0" fill="#56d4dd">get_vector</tspan><tspan x="452.8" textLength="8.4" fill="#e6edf3">(</tspan><tspan x="461.2" textLength="75.6" fill="#d2a8ff">"ui_left"</tspan><tspan x="536.8" textLength="16.8" fill="#e6edf3">, </tspan><tspan x="553.6" textLength="84.0" fill="#d2a8ff">"ui_right"</tspan><tspan x="637.6" textLength="16.8" fill="#e6edf3">, </tspan><tspan x="654.4" textLength="58.8" fill="#d2a8ff">"ui_up"</tspan><tspan x="713.2" textLength="16.8" fill="#e6edf3">, </tspan><tspan x="730.0" textLength="75.6" fill="#d2a8ff">"ui_down"</tspan><tspan x="805.6" textLength="16.8" fill="#e6edf3">);</tspan></text>
  <text y="470"><tspan x="32.8" textLength="100.8" fill="#56d4dd">set_velocity</tspan><tspan x="133.6" textLength="8.4" fill="#e6edf3">(</tspan><tspan x="142.0" textLength="58.8" fill="#7ee787">Vector3</tspan><tspan x="200.8" textLength="84.0" fill="#e6edf3">(input.x, </tspan><tspan x="284.8" textLength="8.4" fill="#d2a8ff">0</tspan><tspan x="293.2" textLength="168.0" fill="#e6edf3">, input.y) * speed);</tspan></text>
  <text y="490"><tspan x="32.8" textLength="117.6" fill="#56d4dd">move_and_slide</tspan><tspan x="150.4" textLength="25.2" fill="#e6edf3">();</tspan></text>
  <text y="510"><tspan x="16.0" textLength="8.4" fill="#e6edf3">}</tspan></text>
  </g>
</svg>
