<svg xmlns="http://www.w3.org/2000/svg" width="847" height="549" viewBox="0 0 847 549">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">/// The player's character.</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Player</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">CharacterBody3D</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">signal</tspan><tspan fill="#e6edf3"> died</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#79c0ff">@export_range</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">100</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="170"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> health: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">100</tspan></text>
  <text x="16" y="190"></text>
  <text x="16" y="210"><tspan fill="#79c0ff">@export</tspan></text>
  <text x="16" y="230"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> speed: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">5.0</tspan></text>
  <text x="16" y="250"></text>
  <text x="16" y="270"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">hurt</tspan><tspan fill="#e6edf3">(amount: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  health -= amount;</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (health &lt;= </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">emit</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">died</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="390"></text>
  <text x="16" y="410"><tspan fill="#79c0ff">@override</tspan></text>
  <text x="16" y="430"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_physics_process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Vector2</tspan><tspan fill="#e6edf3"> input = </tspan><tspan fill="#7ee787">Input</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">get_singleton</tspan><tspan fill="#e6edf3">()-&gt;</tspan><tspan fill="#56d4dd">get_vector</tspan><tspan fill="#e6edf3">(</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">      </tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"ui_left"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"ui_right"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"ui_up"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"ui_down"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">set_velocity</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">(input.x, </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">, input.y) * speed);</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">move_and_slide</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="530"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
