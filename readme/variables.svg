<svg xmlns="http://www.w3.org/2000/svg" width="537" height="329" viewBox="0 0 537 329">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> speed: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">5.0</tspan></text>
  <text x="16" y="50"></text>
  <text x="16" y="70"><tspan fill="#79c0ff">@onready</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> camera: </tspan><tspan fill="#7ee787">Camera3D</tspan><tspan fill="#e6edf3"> = get_node&lt;</tspan><tspan fill="#7ee787">Camera3D</tspan><tspan fill="#e6edf3">&gt;(</tspan><tspan fill="#d2a8ff">"Camera"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> ammo: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> ammo_ = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">get</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> ammo_;</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">set</tspan><tspan fill="#e6edf3">(value) {</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">    ammo_ = value &lt; </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> ? </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> : value;</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
