<svg xmlns="http://www.w3.org/2000/svg" width="646" height="209" viewBox="0 0 646 209">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">spawn</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3"> *marker = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3">;            </tspan><tspan fill="#8b949e">// a node: a pointer</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Ref</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">ArrayMesh</tspan><tspan fill="#e6edf3">&gt; mesh = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">ArrayMesh</tspan><tspan fill="#e6edf3">;    </tspan><tspan fill="#8b949e">// a resource: a reference</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Ext</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">Terrain</tspan><tspan fill="#e6edf3">&gt; terrain = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Terrain</tspan><tspan fill="#e6edf3">;     </tspan><tspan fill="#8b949e">// an extern</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Bullet</tspan><tspan fill="#e6edf3"> *bullet = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Bullet</tspan><tspan fill="#e6edf3">;            </tspan><tspan fill="#8b949e">// taken from Bullet's pool</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">destroy</tspan><tspan fill="#e6edf3"> marker;                            </tspan><tspan fill="#8b949e">// deletes it</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">destroy</tspan><tspan fill="#e6edf3"> bullet;                            </tspan><tspan fill="#8b949e">// gives it back to the pool</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
