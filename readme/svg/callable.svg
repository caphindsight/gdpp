<svg xmlns="http://www.w3.org/2000/svg" width="570" height="289" viewBox="0 0 570 289">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">on ready</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// A function of this class, of another object,</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// or by name, e.g. a script's.</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">connect</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"died"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">callable</tspan><tspan fill="#e6edf3"> respawn);</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  timer-&gt;</tspan><tspan fill="#56d4dd">connect</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"timeout"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">callable</tspan><tspan fill="#e6edf3"> hud-&gt;refresh);</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  timer-&gt;</tspan><tspan fill="#56d4dd">connect</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">string_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"timeout"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">callable</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">"_on_timeout"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// A lambda, which belongs to this object.</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">create_tween</tspan><tspan fill="#e6edf3">()-&gt;</tspan><tspan fill="#56d4dd">tween_callback</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">callable</tspan><tspan fill="#e6edf3"> [</tspan><tspan fill="#e3b341">this</tspan><tspan fill="#e6edf3">] { </tspan><tspan fill="#56d4dd">hide</tspan><tspan fill="#e6edf3">(); });</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">adder</tspan><tspan fill="#e6edf3">(n: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">Callable</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">callable</tspan><tspan fill="#e6edf3"> [n](</tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> x) -&gt; </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> { </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> x + n; };</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
