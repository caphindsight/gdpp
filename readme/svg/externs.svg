<svg xmlns="http://www.w3.org/2000/svg" width="411" height="349" viewBox="0 0 411 349">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Car</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="70"></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> terrain: </tspan><tspan fill="#7ee787">Terrain</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#79c0ff">@override</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_physics_process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3"> pos = </tspan><tspan fill="#56d4dd">get_position</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  pos.y = terrain-&gt;</tspan><tspan fill="#56d4dd">height_at</tspan><tspan fill="#e6edf3">(pos.x, pos.z);</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">set_position</tspan><tspan fill="#e6edf3">(pos);</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="250"></text>
  <text x="16" y="270"><tspan fill="#e3b341">extern</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Terrain</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">height_at</tspan><tspan fill="#e6edf3">(x: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">, z: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">float</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
