  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">spawn</tspan><tspan fill="#e6edf3">(count: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, at: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">)) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Spawning "</tspan><tspan fill="#e6edf3">, count, </tspan><tspan fill="#d2a8ff">" at "</tspan><tspan fill="#e6edf3">, at);</tspan></text>
