<svg xmlns="http://www.w3.org/2000/svg" width="369" height="209" viewBox="0 0 369 209">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@const</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">is_alive</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">bool</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> health &gt; </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#79c0ff">@static</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">damage_at</tspan><tspan fill="#e6edf3">(distance: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> distance &lt; </tspan><tspan fill="#d2a8ff">2.0</tspan><tspan fill="#e6edf3"> ? </tspan><tspan fill="#d2a8ff">50</tspan><tspan fill="#e6edf3"> : </tspan><tspan fill="#d2a8ff">10</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
