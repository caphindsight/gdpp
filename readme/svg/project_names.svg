<svg xmlns="http://www.w3.org/2000/svg" width="604" height="249" viewBox="0 0 604 249">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// With [names] in the package's .gd++pkg, e.g. actions = "Action":</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">// C++ names of input actions, groups and layers, which the compiler</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">// checks. Godot never sees them.</tspan></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@export_flags_3d_physics</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> mask: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#7ee787">Physics3D</tspan><tspan fill="#e6edf3">::PLAYER | </tspan><tspan fill="#7ee787">Physics3D</tspan><tspan fill="#e6edf3">::WORLD</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#e3b341">on physics_process</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">Input</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">get_singleton</tspan><tspan fill="#e6edf3">()-&gt;</tspan><tspan fill="#56d4dd">is_action_pressed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">Action</tspan><tspan fill="#e6edf3">::jump)) {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">jump</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
