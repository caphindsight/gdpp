<svg xmlns="http://www.w3.org/2000/svg" width="587" height="369" viewBox="0 0 587 369">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> target: </tspan><tspan fill="#7ee787">Vector2</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> pending: </tspan><tspan fill="#7ee787">Async</tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#7ee787">PackedVector2Array</tspan><tspan fill="#e6edf3">]</tspan></text>
  <text x="16" y="70"></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@onthread</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">find_path</tspan><tspan fill="#e6edf3">(from: </tspan><tspan fill="#7ee787">Vector2</tspan><tspan fill="#e6edf3">, to: </tspan><tspan fill="#7ee787">Vector2</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">PackedVector2Array</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">PackedVector2Array</tspan><tspan fill="#e6edf3"> path;</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// ... a long search, which stops early if is_cancelled ...</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> path;</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (!pending) {</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">    pending = </tspan><tspan fill="#56d4dd">find_path</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">get_position</tspan><tspan fill="#e6edf3">(), target);</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  } </tspan><tspan fill="#e3b341">else</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#e3b341">is_done</tspan><tspan fill="#e6edf3"> pending) {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">follow</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">claim</tspan><tspan fill="#e6edf3"> pending);</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
