<svg xmlns="http://www.w3.org/2000/svg" width="427" height="269" viewBox="0 0 427 269">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// The file-level class: the rest of the file.</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Player</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">CharacterBody3D</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> coins: </tspan><tspan fill="#7ee787">int</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#8b949e">// An inline class. Any number of them.</tspan></text>
  <text x="16" y="170"><tspan fill="#8b949e">// Without extends, a class extends RefCounted.</tspan></text>
  <text x="16" y="190"><tspan fill="#e3b341">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Coin</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Area3D</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> value: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
