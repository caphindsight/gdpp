  <text x="16" y="90"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">EditorPlugin</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#e3b341">on enter_tree</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">add_custom_type</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Terrain"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">"Node3D"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">nullptr</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#e3b341">nullptr</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">}</tspan></text>
  </g>
