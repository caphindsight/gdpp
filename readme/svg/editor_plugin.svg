<svg xmlns="http://www.w3.org/2000/svg" width="511" height="189" viewBox="0 0 511 189">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Added to the editor, without a plugin.cfg.</tspan></text>
