<svg xmlns="http://www.w3.org/2000/svg" width="318" height="309" viewBox="0 0 318 309">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Bullet</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Area3D</tspan></text>
  <text x="16" y="70"></text>
  <text x="16" y="90"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">static</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">inline</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> alive = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#e3b341">ctor</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  alive++;</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="230"></text>
  <text x="16" y="250"><tspan fill="#e3b341">dtor</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  alive--;</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">}</tspan></text>
