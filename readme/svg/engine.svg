<svg xmlns="http://www.w3.org/2000/svg" width="394" height="329" viewBox="0 0 394 329">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// When the node gets ready.</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">on ready</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Ready."</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#8b949e">// Every frame. It turns processing on too.</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">on process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">rotate_y</tspan><tspan fill="#e6edf3">(delta);</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#8b949e">// Right before the object is deleted.</tspan></text>
  <text x="16" y="250"><tspan fill="#8b949e">// A base's on blocks run too.</tspan></text>
  <text x="16" y="270"><tspan fill="#e3b341">on predelete</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"About to be deleted."</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
