<svg xmlns="http://www.w3.org/2000/svg" width="427" height="229" viewBox="0 0 427 229">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@export_category</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Hero"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">// The inspector shows stat_health as "Health".</tspan></text>
  <text x="16" y="70"><tspan fill="#79c0ff">@export_group</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Stats"</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">"stat_"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> stat_health: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">100</tspan></text>
  <text x="16" y="110"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> stat_mana: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">50</tspan></text>
  <text x="16" y="130"><tspan fill="#79c0ff">@export_subgroup</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Luck"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="150"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> stat_luck: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1</tspan></text>
  <text x="16" y="170"></text>
  <text x="16" y="190"><tspan fill="#79c0ff">@export_group</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Movement"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="210"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> speed: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">5.0</tspan></text>
  </g>
</svg>
