<svg xmlns="http://www.w3.org/2000/svg" width="637" height="469" viewBox="0 0 637 469">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Heightmap</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Sprite2D</tspan></text>
  <text x="16" y="70"></text>
  <text x="16" y="90"><tspan fill="#8b949e">// GLSL that the class's shaders share.</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">shader</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">hash</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3"> p) {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">fract</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">sin</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">dot</tspan><tspan fill="#e6edf3">(p, </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">12.9898</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">78.233</tspan><tspan fill="#e6edf3">))) * </tspan><tspan fill="#d2a8ff">43758.5453</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#8b949e">// Runs on the GPU, once for each pixel.</tspan></text>
  <text x="16" y="250"><tspan fill="#e3b341">shader</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">noise</tspan><tspan fill="#e6edf3">(size: </tspan><tspan fill="#7ee787">Vector2i</tspan><tspan fill="#e6edf3">, scale: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">Texture2D</tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#7ee787">r8</tspan><tspan fill="#e6edf3">] {</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3"> p = </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">id</tspan><tspan fill="#e6edf3">) / scale;</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3"> c = </tspan><tspan fill="#56d4dd">floor</tspan><tspan fill="#e6edf3">(p), f = </tspan><tspan fill="#56d4dd">fract</tspan><tspan fill="#e6edf3">(p);</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3"> u = f * f * (</tspan><tspan fill="#d2a8ff">3.0</tspan><tspan fill="#e6edf3"> - </tspan><tspan fill="#d2a8ff">2.0</tspan><tspan fill="#e6edf3"> * f);</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">mix</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">mix</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">hash</tspan><tspan fill="#e6edf3">(c), </tspan><tspan fill="#56d4dd">hash</tspan><tspan fill="#e6edf3">(c + </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">)), u.x),</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">             </tspan><tspan fill="#56d4dd">mix</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">hash</tspan><tspan fill="#e6edf3">(c + </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">)), </tspan><tspan fill="#56d4dd">hash</tspan><tspan fill="#e6edf3">(c + </tspan><tspan fill="#7ee787">vec2</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">)), u.x), u.y);</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="390"></text>
  <text x="16" y="410"><tspan fill="#e3b341">on ready</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="430"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">set_texture</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">noise</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">Vector2i</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">512</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">512</tspan><tspan fill="#e6edf3">), </tspan><tspan fill="#d2a8ff">32.0</tspan><tspan fill="#e6edf3">));</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
