  <text x="16" y="110"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">set_progress</tspan><tspan fill="#e6edf3">(percent: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  bar-&gt;</tspan><tspan fill="#56d4dd">set_value</tspan><tspan fill="#e6edf3">(percent);</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">}</tspan></text>
