<svg xmlns="http://www.w3.org/2000/svg" width="461" height="169" viewBox="0 0 461 169">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@onready</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> bar: </tspan><tspan fill="#7ee787">ProgressBar</tspan><tspan fill="#e6edf3"> = get_node&lt;</tspan><tspan fill="#7ee787">ProgressBar</tspan><tspan fill="#e6edf3">&gt;(</tspan><tspan fill="#d2a8ff">"Bar"</tspan><tspan fill="#e6edf3">)</tspan></text>
