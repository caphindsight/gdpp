<svg xmlns="http://www.w3.org/2000/svg" width="587" height="309" viewBox="0 0 587 309">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@global</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">#include</tspan><tspan fill="#e6edf3"> &lt;random&gt;</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  std::mt19937 rng_{std::random_device{}()};</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">roll</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> sides);</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="190"></text>
  <text x="16" y="210"><tspan fill="#e3b341">impl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">This</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">roll</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> sides) {</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> std::uniform_int_distribution&lt;</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3">&gt;(</tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, sides)(rng_);</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
