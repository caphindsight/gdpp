<svg xmlns="http://www.w3.org/2000/svg" width="495" height="409" viewBox="0 0 495 409">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Outside the class, in its header.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@global</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">#include</tspan><tspan fill="#e6edf3"> &lt;random&gt;</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#8b949e">// In the class, in its header.</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  std::mt19937 rng_{std::random_device{}()};</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">roll</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> sides);</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="230"></text>
  <text x="16" y="250"><tspan fill="#8b949e">// In its source file. `This` names the</tspan></text>
  <text x="16" y="270"><tspan fill="#8b949e">// current class, like `Self` in Rust.</tspan></text>
  <text x="16" y="290"><tspan fill="#e3b341">impl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">This</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">roll</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> sides) {</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">    std::uniform_int_distribution&lt;</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3">&gt; </tspan><tspan fill="#56d4dd">d</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3">, sides);</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">d</tspan><tspan fill="#e6edf3">(rng_);</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
