<svg xmlns="http://www.w3.org/2000/svg" width="377" height="329" viewBox="0 0 377 329">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Doc comments become the editor's help.</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">/// A chest full of [member gold].</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">///</tspan></text>
  <text x="16" y="90"><tspan fill="#8b949e">/// Opens when the player comes close.</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Chest</tspan></text>
  <text x="16" y="130"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Area3D</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#8b949e">/// How many coins the chest holds.</tspan></text>
  <text x="16" y="190"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> gold: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">10</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#8b949e">/** Gives the coins to [param player]. */</tspan></text>
  <text x="16" y="250"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">open</tspan><tspan fill="#e6edf3">(player: </tspan><tspan fill="#7ee787">Player</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  player-&gt;</tspan><tspan fill="#56d4dd">add_coins</tspan><tspan fill="#e6edf3">(gold);</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  gold = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
