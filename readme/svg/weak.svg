<svg xmlns="http://www.w3.org/2000/svg" width="545" height="269" viewBox="0 0 545 269">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="50"><tspan fill="#e6edf3">  gdpp::</tspan><tspan fill="#7ee787">Weak</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">ArrayMesh</tspan><tspan fill="#e6edf3">&gt; cache_;</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">mesh</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">ArrayMesh</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Ref</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">ArrayMesh</tspan><tspan fill="#e6edf3">&gt; m = cache_;   </tspan><tspan fill="#8b949e">// null once the mesh is freed</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (m.</tspan><tspan fill="#56d4dd">is_null</tspan><tspan fill="#e6edf3">()) {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">    m = </tspan><tspan fill="#56d4dd">build_mesh</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">    cache_ = m;</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> m;</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">}</tspan></text>
  </g>
