<svg xmlns="http://www.w3.org/2000/svg" width="436" height="209" viewBox="0 0 436 209">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// TypedArray&lt;Item&gt; in C++.</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> items: </tspan><tspan fill="#7ee787">Array</tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#7ee787">Item</tspan><tspan fill="#e6edf3">]</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">// TypedDictionary&lt;String, int64_t&gt; in C++.</tspan></text>
  <text x="16" y="90"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> prices: </tspan><tspan fill="#7ee787">Dictionary</tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#7ee787">String</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">]</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">add</tspan><tspan fill="#e6edf3">(item: </tspan><tspan fill="#7ee787">Item</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  items.</tspan><tspan fill="#56d4dd">push_back</tspan><tspan fill="#e6edf3">(item);</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  prices[item-&gt;</tspan><tspan fill="#56d4dd">get_title</tspan><tspan fill="#e6edf3">()] = item-&gt;</tspan><tspan fill="#56d4dd">get_price</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
