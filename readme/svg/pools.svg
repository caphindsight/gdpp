  <text x="16" y="530"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_on_hit</tspan><tspan fill="#e6edf3">(bullet: </tspan><tspan fill="#7ee787">Bullet</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="550"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">destroy</tspan><tspan fill="#e6edf3"> bullet;</tspan></text>
