  <text x="16" y="330"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Kept for later."</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="370"></text>
  <text x="16" y="390"><tspan fill="#e3b341">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Gun</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="430"></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">fire</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">add_child</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Bullet</tspan><tspan fill="#e6edf3">);</tspan></text>
