  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Created."</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#79c0ff">@recycle</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">ctor</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Reused."</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">}</tspan></text>
