<svg xmlns="http://www.w3.org/2000/svg" width="495" height="209" viewBox="0 0 495 209">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">import</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Material</tspan></text>
  <text x="16" y="50"></text>
  <text x="16" y="70"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">tint</tspan><tspan fill="#e6edf3">(mesh: </tspan><tspan fill="#7ee787">MeshInstance3D</tspan><tspan fill="#e6edf3">, color: </tspan><tspan fill="#7ee787">Color</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">auto</tspan><tspan fill="#e6edf3"> material = mesh-&gt;</tspan><tspan fill="#56d4dd">get_active_material</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">auto</tspan><tspan fill="#e6edf3"> standard = material </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">StandardMaterial3D</tspan><tspan fill="#e6edf3"> *;</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (standard) {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">    standard-&gt;</tspan><tspan fill="#56d4dd">set_albedo</tspan><tspan fill="#e6edf3">(color);</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
