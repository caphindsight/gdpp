<svg xmlns="http://www.w3.org/2000/svg" width="520" height="369" viewBox="0 0 520 369">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Calling `create Enemy` in code instantiates this scene.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@scene</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"res://enemy.tscn"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Enemy</tspan></text>
  <text x="16" y="90"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">CharacterBody3D</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#e3b341">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Spawner</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="170"></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">spawn</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">// The scene's root, with its children.</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">Gd</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">Enemy</tspan><tspan fill="#e6edf3">&gt; enemy = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Enemy</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">// Null if the root isn't an Enemy.</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (enemy) {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">      </tspan><tspan fill="#56d4dd">add_child</tspan><tspan fill="#e6edf3">(enemy);</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">    }</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
