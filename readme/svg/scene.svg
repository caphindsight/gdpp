<svg xmlns="http://www.w3.org/2000/svg" width="301" height="309" viewBox="0 0 301 309">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#79c0ff">@scene</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"pkg://enemy.tscn"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="50"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Enemy</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">CharacterBody3D</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#e3b341">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Spawner</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">spawn</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">Enemy</tspan><tspan fill="#e6edf3"> *enemy = </tspan><tspan fill="#e3b341">create</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Enemy</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (enemy) {</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">      </tspan><tspan fill="#56d4dd">add_child</tspan><tspan fill="#e6edf3">(enemy);</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">    }</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
