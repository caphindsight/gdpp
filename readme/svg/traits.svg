<svg xmlns="http://www.w3.org/2000/svg" width="495" height="529" viewBox="0 0 495 529">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Functions that classes with any base share.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@group</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"damageable"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">trait</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Damageable</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">take_damage</tspan><tspan fill="#e6edf3">(amount: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">is_alive</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">bool</tspan><tspan fill="#e6edf3"> { </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">true</tspan><tspan fill="#e6edf3">; }</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="170"></text>
  <text x="16" y="190"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Crate</tspan></text>
  <text x="16" y="210"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">RigidBody3D</tspan></text>
  <text x="16" y="230"><tspan fill="#e3b341">implements</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Damageable</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#7ee787">Named</tspan></text>
  <text x="16" y="250"><tspan fill="#e3b341">implements</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Saveable</tspan></text>
  <text x="16" y="270"></text>
  <text x="16" y="290"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">take_damage</tspan><tspan fill="#e6edf3">(amount: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">apply_impulse</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">, amount, </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">));</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="350"></text>
  <text x="16" y="370"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_on_body_entered</tspan><tspan fill="#e6edf3">(body: </tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// Checked at runtime: null if the body's</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// class doesn't implement Damageable.</tspan></text>
  <text x="16" y="430"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Trait</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">Damageable</tspan><tspan fill="#e6edf3">&gt; target = body </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Trait</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">Damageable</tspan><tspan fill="#e6edf3">&gt;;</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (target) {</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">    target-&gt;</tspan><tspan fill="#56d4dd">take_damage</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">10</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
