<svg xmlns="http://www.w3.org/2000/svg" width="360" height="329" viewBox="0 0 360 329">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// The editor runs its code too.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@tool</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Turntable</tspan></text>
  <text x="16" y="90"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#8b949e">// Spins in the editor and in the game.</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">on process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">rotate_y</tspan><tspan fill="#e6edf3">(delta);</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#8b949e">// Only runs in the game.</tspan></text>
  <text x="16" y="250"><tspan fill="#79c0ff">@game_only</tspan></text>
  <text x="16" y="270"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">launch</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"Launched!"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
