<svg xmlns="http://www.w3.org/2000/svg" width="469" height="429" viewBox="0 0 469 429">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> anim: </tspan><tspan fill="#7ee787">AnimationPlayer</tspan></text>
  <text x="16" y="50"></text>
  <text x="16" y="70"><tspan fill="#8b949e">// A coroutine: await waits for a signal or a</tspan></text>
  <text x="16" y="90"><tspan fill="#8b949e">// task, without blocking. A call returns right</tspan></text>
  <text x="16" y="110"><tspan fill="#8b949e">// away, with an Async task.</tspan></text>
  <text x="16" y="130"><tspan fill="#79c0ff">@async</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">open</tspan><tspan fill="#e6edf3">() -&gt; </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  anim-&gt;</tspan><tspan fill="#56d4dd">play</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"open"</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// Gives the signal's arguments, with their types.</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">StringName</tspan><tspan fill="#e6edf3"> done = </tspan><tspan fill="#e3b341">await</tspan><tspan fill="#e6edf3"> anim-&gt;animation_finished;</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">await</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_tree</tspan><tspan fill="#e6edf3">()-&gt;</tspan><tspan fill="#56d4dd">create_timer</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">1.0</tspan><tspan fill="#e6edf3">)-&gt;timeout;</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">gd</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">randi_range</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">10</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#d2a8ff">50</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="290"></text>
  <text x="16" y="310"><tspan fill="#8b949e">// Detached: returns nothing, nobody waits.</tspan></text>
  <text x="16" y="330"><tspan fill="#79c0ff">@async</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"detached"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="350"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">loot</tspan><tspan fill="#e6edf3">(chest: </tspan><tspan fill="#7ee787">Chest</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> gold = </tspan><tspan fill="#e3b341">await</tspan><tspan fill="#e6edf3"> chest-&gt;</tspan><tspan fill="#56d4dd">open</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">add_gold</tspan><tspan fill="#e6edf3">(gold);</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
