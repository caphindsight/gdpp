<svg xmlns="http://www.w3.org/2000/svg" width="402" height="569" viewBox="0 0 402 569">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// A C++ value type, which Godot sees as a</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">// Dictionary: {"point": ..., "damage": 1}.</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">struct</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Hit</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> point: </tspan><tspan fill="#7ee787">Vector3</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> damage: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1</tspan></text>
  <text x="16" y="130"></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// A Callable in the Dictionary, which</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// scripts call as hit.is_lethal.call(10).</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">is_lethal</tspan><tspan fill="#e6edf3">(hp: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">bool</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> hp &lt;= damage;</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="270"></text>
  <text x="16" y="290"><tspan fill="#e3b341">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Fighter</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">CharacterBody3D</tspan></text>
  <text x="16" y="330"></text>
  <text x="16" y="350"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">signal</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">hit_taken</tspan><tspan fill="#e6edf3">(hit: </tspan><tspan fill="#7ee787">Hit</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="370"></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> health: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">100</tspan></text>
  <text x="16" y="410"></text>
  <text x="16" y="430"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// Scripts pass a Dictionary, e.g.</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// fighter.take({"damage": 3}).</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">take</tspan><tspan fill="#e6edf3">(hit: </tspan><tspan fill="#7ee787">Hit</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">    health -= hit.damage;</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">emit</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">hit_taken</tspan><tspan fill="#e6edf3">(hit);</tspan></text>
  <text x="16" y="530"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="550"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
