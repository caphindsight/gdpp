<svg xmlns="http://www.w3.org/2000/svg" width="537" height="249" viewBox="0 0 537 249">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// The one object of the class, which scripts reach as Game.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@singleton</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Game</tspan></text>
  <text x="16" y="90"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Object</tspan></text>
  <text x="16" y="110"></text>
  <text x="16" y="130"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> score: </tspan><tspan fill="#7ee787">int</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#8b949e">// Elsewhere: Game::get_singleton()-&gt;add(10);</tspan></text>
  <text x="16" y="190"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">add</tspan><tspan fill="#e6edf3">(points: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  score += points;</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
