<svg xmlns="http://www.w3.org/2000/svg" width="436" height="269" viewBox="0 0 436 269">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// The values of Node.ProcessMode, and EDITOR.</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">// Also how to use an engine enum as a type.</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">enum</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Mode</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#7ee787">ProcessMode</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  EDITOR</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">apply</tspan><tspan fill="#e6edf3">(mode: </tspan><tspan fill="#7ee787">Mode</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (mode != </tspan><tspan fill="#7ee787">Mode</tspan><tspan fill="#e6edf3">::EDITOR) {</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">set_process_mode</tspan><tspan fill="#e6edf3">(mode </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#7ee787">ProcessMode</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
