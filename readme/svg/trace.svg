<svg xmlns="http://www.w3.org/2000/svg" width="427" height="229" viewBox="0 0 427 229">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Prints every change.</tspan></text>
  <text x="16" y="50"><tspan fill="#79c0ff">@trace</tspan></text>
  <text x="16" y="70"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> health: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">100</tspan></text>
  <text x="16" y="90"></text>
  <text x="16" y="110"><tspan fill="#8b949e">// Prints every call, its arguments and result.</tspan></text>
  <text x="16" y="130"><tspan fill="#79c0ff">@trace</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">take_damage</tspan><tspan fill="#e6edf3">(amount: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">bool</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  health -= amount;</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> health &lt;= </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
