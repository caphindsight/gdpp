  <text x="16" y="50"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="70"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> ammo_ = </tspan><tspan fill="#d2a8ff">30</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">get</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> ammo_;</tspan></text>
  <text x="16" y="150"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="170"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">set</tspan><tspan fill="#e6edf3">(value) {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">    ammo_ = value &lt; </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> ? </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> : value;</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="250"></text>
  <text x="16" y="270"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> is_empty: </tspan><tspan fill="#7ee787">bool</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">get</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> ammo_ == </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">  }</tspan></text>
